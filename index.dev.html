<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Far From Home: Kruma Express (Dev)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 390px;
      height: 844px;
      background: #5DB7AD; /* Matches Three.js background color seamlessly */
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 16px;
      overflow: hidden;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* Enable pointer events on active interactive items inside HUD */
    #ui-container button, #ui-container input {
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="canvas-container"></div>
    <div id="ui-container"></div>
  </div>

  <!-- Vendor Dependencies -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="vendor/Pass.js"></script>
  <script src="vendor/CopyShader.js"></script>
  <script src="vendor/ShaderPass.js"></script>
  <script src="vendor/RenderPass.js"></script>
  <script src="vendor/MaskPass.js"></script>
  <script src="vendor/EffectComposer.js"></script>

  <!-- Game Source Code -->
  <script src="src/core/economy.js"></script>
  <script src="src/core/scrollDriver.js"></script>
  <script src="src/data/items.js"></script>
  <script src="src/data/shifts.js"></script>
  <script src="src/data/streets.js"></script>
  <script src="src/data/townLayout.js"></script>
  <script src="src/data/townModels.js"></script>
  <script src="src/data/intercom.js"></script>
  <script src="src/data/dialogue.js"></script>
  <script src="src/data/audioTriggers.js"></script>
  <script src="src/data/voiceSprites.js"></script>
  <script src="src/data/shop.js"></script>
  <script src="src/render/celShaderMaterial.js"></script>
  <script src="src/render/inkOutline.js"></script>
  <script src="src/render/dioramaRooms.js"></script>
  <script src="src/render/carouselHub.js"></script>
  <script src="src/render/character.js"></script>
  <script src="src/render/townFactory.js"></script>
  <script src="src/render/titleMesh.js"></script>
  <script src="src/render/geometryFactory.js"></script>
  <script src="src/render/sceneSetup.js"></script>
  <script src="src/render/particles.js"></script>
  <script src="src/audio/sfx.js"></script>
  <script src="src/audio/speech.js"></script>
  <script src="src/ui/hud.js"></script>
  <script src="src/phases/pickPhase.js"></script>
  <script src="src/phases/ridePhase.js"></script>
  <script src="src/phases/intercomPhase.js"></script>
  <script src="src/phases/shopPhase.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
